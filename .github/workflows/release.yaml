name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Release-Tag (z.B. v1.7.6)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: "ubuntu-latest"
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: "actions/checkout@v4"
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Package the integration for HACS
        run: |
          git archive --format=zip --output=envertech_local.zip HEAD:custom_components/envertech_local

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Extract the block between this version header and the next one
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Write to file to preserve newlines
          echo "$NOTES" > release_notes.txt
          echo "Version: $VERSION"
          cat release_notes.txt

      - name: Create GitHub Release
        uses: "softprops/action-gh-release@v2"
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release_notes.txt
          files: envertech_local.zip
          fail_on_unmatched_files: true
          overwrite_files: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
